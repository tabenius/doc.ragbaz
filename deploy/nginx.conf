server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /doc {
        return 301 /doc/;
    }

    location /doc/ {
        try_files $uri $uri/ =404;
    }

    # Legacy subdomain URLs move to the canonical path on ragbaz.cc.
    location / {
        return 301 https://ragbaz.cc/doc$request_uri;
    }

    error_page 404 /doc/404.html;
}
