# Insert in frontend `konsonans`, alongside the other host ACLs:
acl is_doc hdr(host) -i doc.ragbaz.xyz
use_backend doc_backend if is_doc

# Append as a new backend (mirrors offer_backend):
backend doc_backend
        mode http
        option httpchk
        http-check send meth GET uri /healthz ver HTTP/1.1 hdr Host doc.ragbaz.xyz
        http-check expect status 200
        server doc_docs 127.0.0.1:8890 check inter 5000 rise 2 fall 3
        http-reuse safe
        timeout server 30s
